  <ellipse cx="30" cy="36" rx="16" ry="10.5" stroke="#77736f" stroke-width="1.45"/>
  <ellipse cx="30" cy="36" rx="11.7" ry="7.5" stroke="#b8b4b0" stroke-width="1.3" stroke-dasharray="25 6 22 5" transform="rotate(-7 30 36)"/>
  <path d="M52 16 48.8 19c-1.8 1.7-2.9 3.5-3.5 5.5l-.2.8" stroke="#1e1e1e" stroke-width="2.1"/>
  <path d="m43.2 24.5 2.8.8-.9 2.3-2.6-.8z" fill="#fff" stroke="#1e1e1e" stroke-width="1.5"/>
