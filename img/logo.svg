<svg xmlns="http://www.w3.org/2000/svg" width="109" height="101" viewBox="5.25 12.4 54.5 50.35" role="img" aria-labelledby="title desc">
<!-- MUR114-logoen (2026-10-09). Samme tegning som originalen; viewBox er beskåret til tegningen, så den fyller toppfeltet og appikonene.
     Fra v6.71 tegner sidene den med <svg><use href="img/logo.svg#logo">, og de røde delene bruker aksentvariabelen fra stilarket:
     da følger etiketten dagens farge (js/farge.js). Som bilde (fanen, ikonene) gjelder reserven #c9361e. -->
<title id="title">Platespiller – LP-logo i perspektiv</title>
<desc id="desc">En lav sokkel gir plata mer dybde.</desc>
<g id="logo">
