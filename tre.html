  <main class="wrap">
    <div id="banner" class="banner"></div>

    <section class="panel gx-page">
      <!-- Slektstreet er en egen SIDE, ikke en modal — derfor har den ingen
           ←/✕ i et modal-hode. Disse to knappene gjør samme jobb: Tilbake går
           dit du kom fra (Det store bildet, artistkortet …), Lukk går til
           forsiden. -->
      <div class="gx-page-head" style="display:flex;align-items:center;gap:12px">
        <h2 style="margin:0;flex:1">Slektstre</h2>
        <a class="btn ghost small gx-musicmap" style="text-decoration:none" href="https://musicmap.info" target="_blank" rel="noopener">Åpne musicmap.info</a>
        <button type="button" class="btn ghost small" id="gx-back" title="Tilbake" aria-label="Tilbake">← Tilbake</button>
        <a class="btn ghost small" style="text-decoration:none" href="index.html" title="Lukk" aria-label="Lukk">✕ Lukk</a>
      </div>
      <div class="gx-legend" id="gx-legend"></div>
      <div id="gx-tre-mangler" style="display:none;padding:28px 20px;text-align:center">
        <p style="margin:0 0 6px;font-weight:600">Sjangertreet er ikke lastet inn.</p>
        <p style="margin:0;color:var(--muted)">Treet ligger i databasen (content/genealogy). Er du lærer, importer Innholdspakka på lærersiden for å legge det inn.</p>
      </div>
      <div class="gx-stage gx-stage-tall" id="gx-stage">
        <div class="gx-ctrl">
          <button id="gx-zin" type="button" aria-label="Zoom inn">+</button>
          <button id="gx-zout" type="button" aria-label="Zoom ut">−</button>
          <button id="gx-rst" type="button" aria-label="Tilbakestill">⤺</button>
        </div>
        <svg id="gx-svg" width="100%" height="100%" role="group" aria-label="Slektstre over sjangrene"><g id="gx-cam"></g></svg>
      </div>
    </section>
  </main>

  <footer class="sitefoot wrap"></footer>

  <!-- Sjanger-, artistliste-, spilleliste- og teknologi-detalj-modalene deles
       med forsiden og injiseres av initExplore (markup i js/utforsk/explore-modals.js,
       de delte fragmentene i js/ui/ui-modal-fragments.js). -->

  <!-- Artist-detalj-popup (åpnes fra artistlisten; kun denne siden) -->
  <div class="modal-backdrop" id="modal-artist-detail">
    <div class="modal modal-innhold">
      <div class="modal-head">
        <h2 id="ad-title"></h2>
        <button class="modal-close btn ghost small">✕</button>
      </div>
      <div id="ad-body"></div>
    </div>
  </div>

  <!-- Endringsforslag (student), samme som på forsiden (v6.08, S8) -->
  <div class="modal-backdrop" id="modal-proposal">
    <div class="modal modal-wide">
      <div class="modal-head">
        <h2 id="prop-title">Foreslå endring</h2>
        <button class="modal-close btn ghost small">✕</button>
      </div>
      <form id="prop-form" class="add-grid"></form>
      <label style="display:block;margin:14px 0 0">Ditt navn (kun fornavn) *
        <input type="text" id="prop-by" placeholder="Fornavn" required maxlength="100" />
      </label>
      <div id="prop-msg" class="form-msg" style="margin-top:10px"></div>
      <div class="modal-foot-right">
        <button type="button" class="btn primary" id="prop-submit">Send forslag</button>
      </div>
    </div>
  </div>
