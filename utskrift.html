  <main class="wrap utskrift-side">
    <div id="banner" class="banner"></div>

    <!-- Panelet: bare på skjerm (css/utskrift.css skjuler det ved utskrift). -->
    <section class="panel utskrift-panel" id="utskrift-panel">
      <div class="utskrift-topp">
        <div>
          <h2>Utskrift</h2>
          <p class="muted utskrift-intro">Velg hva som skal med. Heftet under viser hvordan det blir på papir. «Skriv ut» åpner utskriftsdialogen, der du kan velge «Lagre som PDF».</p>
        </div>
        <div class="utskrift-knapper">
          <button type="button" class="btn primary" id="utskrift-skriv-ut" disabled>Skriv ut / lagre som PDF</button>
          <button type="button" class="btn ghost small" id="utskrift-lenke" title="Lenke som åpner dette utvalget i en annen nettleser" disabled>Kopier lenke</button>
          <button type="button" class="btn ghost small danger" id="utskrift-toem" disabled>Tøm utvalget</button>
        </div>
      </div>
      <p class="muted" id="utskrift-status">Laster innholdet …</p>
      <div class="utskrift-kolonner">
        <details class="utskrift-boks" open>
          <summary>Utvalg <span id="utskrift-antall-tekst"></span></summary>
          <div class="utskrift-sok">
            <input type="search" id="utskrift-sok" class="sok-felt" autocomplete="off" enterkeyhint="search"
              placeholder="Legg til: søk etter artist, sjanger, tiår, innovasjon …" aria-label="Legg til i utvalget" />
            <div id="utskrift-sok-treff" class="utskrift-sok-treff" aria-live="polite"></div>
          </div>
          <ul id="utskrift-liste" class="utskrift-liste"></ul>
          <label class="utskrift-rekkefolge">Rekkefølge
            <select id="utskrift-rekkefolge">
              <option value="kronologisk">Kronologisk: metasjanger, sjanger, artist</option>
              <option value="valgt">Som valgt</option>
            </select>
          </label>
        </details>
        <details class="utskrift-boks">
          <summary>Tittel og innhold</summary>
          <label class="utskrift-tittel">Tittel
            <input type="text" id="utskrift-tittel" maxlength="60" autocomplete="off" />
          </label>
          <p class="muted" id="utskrift-tittel-hint"></p>
          <div id="utskrift-deler"></div>
          <fieldset class="utskrift-form">
            <legend>Form</legend>
            <label><input type="radio" name="utskrift-form" value="lesevennlig" checked /> Lesevennlig, med bilder</label>
            <label><input type="radio" name="utskrift-form" value="kompakt" /> Kompakt, uten bilder</label>
          </fieldset>
        </details>
      </div>
    </section>

    <!-- Heftet: forhåndsvisningen på skjerm og det som faktisk skrives ut. -->
    <div id="hefte" class="hefte"><p class="muted hefte-melding">Laster innholdet …</p></div>
  </main>

  <footer class="sitefoot wrap"></footer>

  <script src="js/load-guard.js?v=5.62"></script>
  <script type="module" src="js/utskrift.js?v=5.62"></script>
</body>
</html>
